# Follows astli's releases: pins the newest version and tags it. Polling the
# release rather than being notified by the astli repository needs no token of
# its own. astli's releases are immutable, so one is published with every
# binary attached, and the latest is complete as soon as it is listed.
name: Bump

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pin and tag the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/fischeti/astli/releases/latest --jq '.tag_name | ltrimstr("v")')
          # The `version` input's default alone, since other inputs have
          # defaults of their own.
          version='/^  version:$/,/^  [^ ]/'
          current=$(sed -n "${version}s/^    default: \\(.*\\)\$/\\1/p" action.yml)
          if [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "astli $current is the latest"
            exit 0
          fi
          sed -i "${version}s/^    default: $current\$/    default: $latest/" action.yml
          sed -i "s/astli-action@v$current/astli-action@v$latest/" README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "astli $latest"
          git tag "v$latest"
          git push origin HEAD "v$latest"
