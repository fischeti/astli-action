# Follows astli's releases: pins the newest version and tags it. Polling the
# release rather than being notified by the astli repository needs no token of
# its own. dist uploads the binaries after it creates the release, so a release
# is taken only once every artifact its manifest names is there.
name: Bump

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pin and tag the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/fischeti/astli/releases/latest)
          latest=$(jq -r '.tag_name | ltrimstr("v")' <<<"$release")
          current=$(sed -n 's/^    default: \([0-9][^ ]*\)$/\1/p' action.yml)
          if [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "astli $current is the latest"
            exit 0
          fi
          # The manifest names every artifact dist builds, among them the
          # installer and each archive it may download.
          if ! jq -e 'any(.assets[]; .name == "dist-manifest.json")' <<<"$release" >/dev/null; then
            echo "astli $latest has no dist-manifest.json yet"
            exit 0
          fi
          manifest=$(gh release download "v$latest" -R fischeti/astli -p dist-manifest.json -O -)
          missing=$(jq -r --argjson release "$release" \
            '[$release.assets[].name] as $have | .artifacts | keys[] | select(. as $name | $have | index($name) | not)' \
            <<<"$manifest")
          if [ -n "$missing" ]; then
            echo "astli $latest has none of $missing yet"
            exit 0
          fi
          sed -i "s/^    default: $current\$/    default: $latest/" action.yml
          sed -i "s/astli-action@v$current/astli-action@v$latest/" README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "astli $latest"
          git tag "v$latest"
          git push origin HEAD "v$latest"
